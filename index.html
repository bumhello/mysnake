<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Змейка — Telegram Mini App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="hud">
      <div class="hud__item">
        <span class="hud__label">Очки</span>
        <span class="hud__value" id="score">0</span>
      </div>
      <div class="hud__item hud__item--center">
        <span class="hud__title">🐍 ЗМЕЙКА</span>
      </div>
      <div class="hud__item hud__item--right">
        <span class="hud__label">Скорость</span>
        <span class="hud__value" id="speed">1</span>
      </div>
    </header>

    <main class="stage">
      <canvas id="game"></canvas>

      <div class="overlay" id="overlay">
        <div class="overlay__panel">
          <div class="overlay__icon" id="overlayIcon">🐍</div>
          <h1 class="overlay__title" id="overlayTitle">Змейка</h1>
          <p class="overlay__text" id="overlayText">Свайпните по экрану, чтобы начать</p>
          <p class="overlay__hint" id="overlayHint">Ешьте еду, расти, не врезайтесь!</p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span class="footer__hint">↑↓←→ Свайп для управления</span>
    </footer>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="game.js"></script>
</body>
</html>
